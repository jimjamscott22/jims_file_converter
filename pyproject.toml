[project]
name = "jims-file-converter"
version = "1.0.0"
description = "A modern web-based file conversion tool built with FastAPI."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "httpx==0.25.1",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "aiofiles==23.2.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "jinja2==3.1.2",
    "python-magic-bin==0.4.14; platform_system == 'Windows'",
    "python-magic==0.4.27; platform_system != 'Windows'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.12",
]

[tool.uv]
package = false
